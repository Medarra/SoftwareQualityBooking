name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: mkdir -p test-results

      - name: Run Vitest
        run: |
          npm test -- BookingApp.Tests/unit \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=test-results/junit.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: mkdir -p test-results

      - name: Run API Tests
        run: |
          npm test -- BookingApp.Tests/api \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=test-results/junit.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: test-results

  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: mkdir -p test-results

      - name: Run UI Tests
        shell: bash
        run: |
          if find BookingApp.Tests/ui -type f -name '*.spec.js' -size +0c -print -quit | grep -q .; then
            npm test -- BookingApp.Tests/ui \
              --reporter=default \
              --reporter=junit \
              --outputFile.junit=test-results/junit.xml
          else
            echo "No UI tests found; skipping UI test execution."
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: test-results
          if-no-files-found: ignore