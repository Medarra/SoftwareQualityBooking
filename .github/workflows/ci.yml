name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: mkdir -p test-results

      - name: Run Vitest
        run: |
          npm test -- BookingApp.Tests/unit \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=test-results/junit.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: mkdir -p test-results

      - name: Run API Tests
        run: |
          npm test -- BookingApp.Tests/api \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=test-results/junit.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: test-results

  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: mkdir -p test-results

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Start Application
        shell: bash
        run: |
          node server.js > test-results/server.log 2>&1 &
          echo $! > test-results/server.pid
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:3000/api/bootstrap

      - name: Run UI Tests
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/playwright.xml
        run: npx playwright test BookingApp.Tests/ui --reporter=line,junit

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: test-results
          if-no-files-found: ignore